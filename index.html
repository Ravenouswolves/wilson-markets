<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#121a17">
<script>
/* Apply the saved theme before first paint so there's no flash. */
(function(){var K='wilsonMarkets.theme',M={dark:'#121a17',light:'#eef2ed'};
  var mq=window.matchMedia&&matchMedia('(prefers-color-scheme: light)');
  function pref(){try{return localStorage.getItem(K)||'system'}catch(e){return'system'}}
  function apply(){var p=pref(),t=p==='system'?(mq&&mq.matches?'light':'dark'):p;
    document.documentElement.setAttribute('data-theme',t);var m=document.querySelector('meta[name="theme-color"]');if(m)m.setAttribute('content',M[t])}
  window.__theme={key:K,pref:pref,apply:apply,set:function(p){try{localStorage.setItem(K,p)}catch(e){}apply()}};
  apply();if(mq&&mq.addEventListener)mq.addEventListener('change',function(){if(pref()==='system'){apply();if(window.route)window.route()}});
})();
</script>
<title>Wilson Markets</title>
<style>
:root{--r:18px;--nav:68px;color-scheme:dark;
  --bg:#121a17;--card:#1a2420;--card2:#222e29;--navbg:#1a2420;--ink:#e6ebe7;--muted:#9aa89f;--line:#2e3c36;--body-ink:#d3dad5;
  --accent:#86b3ab;--on-accent:#122420;--up:#9ccb9f;--down:#e3938f;--gold:#cdb88a;--purple:#a6a7c4;--pink:#c49fab;--tag-ink:#b9a983;
  --hole:#121a17;--brief-bg:linear-gradient(150deg,#1f2b26 0%,#1b2622 60%,#212a25 100%);--brief-line:#344740;--stat-bg:rgba(0,0,0,.2);
  --legend:linear-gradient(90deg,#9e504b,#5b3e3a 40%,#2e3c36 50%,#3f5c48 60%,#55875f);
  --heat-n:46,60,54;--heat-up:74,124,88;--heat-down:156,76,72;--tile-ink:#f2f5f1;--tile-shadow:0 1px 2px rgba(0,0,0,.25);
  --chart-grid:#25322d;--chart-label:#7f8d86;--on-tag:#121a17;--ring-track:#2a3832;--ring-hi:#8fbf95;--ring-good:#7fa9a2;--ring-mid:#c2ae82;--ring-low:#cf8783;
  --logo-bg:#263630;--logo-line:#3a4f46;--logo-bar:#86b3ab;--logo-arrow:#cdb88a}
:root[data-theme="light"]{color-scheme:light;
  --bg:#eef2ed;--card:#f8faf7;--card2:#e7ede6;--navbg:#f8faf7;--ink:#1b2a23;--muted:#56665c;--line:#d2dcd3;--body-ink:#2b3a32;
  --accent:#3e6f68;--on-accent:#f5f9f6;--up:#3b7349;--down:#9d443d;--gold:#7a6537;--purple:#575a85;--pink:#86505f;--tag-ink:#76643b;
  --hole:#eef2ed;--brief-bg:linear-gradient(150deg,#f4f8f2 0%,#eef4ec 60%,#f3f4ec 100%);--brief-line:#cbd9ce;--stat-bg:rgba(255,255,255,.75);
  --legend:linear-gradient(90deg,#d29a92,#e6cbc5 40%,#dde4dd 50%,#bfd6c2 60%,#93bd99);
  --heat-n:221,228,221;--heat-up:147,189,153;--heat-down:214,152,143;--tile-ink:#1b2a23;--tile-shadow:none;
  --chart-grid:#e1e8e1;--chart-label:#66766c;--on-tag:#f8faf7;--ring-track:#dfe7df;--ring-hi:#4b875a;--ring-good:#427670;--ring-mid:#8c7745;--ring-low:#a4534b;
  --logo-bg:#dce7de;--logo-line:#c2d2c5;--logo-bar:#3e6f68;--logo-arrow:#8c7745}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;background:var(--bg);color:var(--ink);font:15px/1.45 -apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Inter,Helvetica,Arial,sans-serif}
body{max-width:520px;margin:0 auto;padding-bottom:calc(var(--nav) + 18px + env(safe-area-inset-bottom))}
button,input,select{font:inherit;color:inherit}
button{cursor:pointer}
a{color:var(--accent)}
.ico{display:inline-block;vertical-align:middle;flex:none}
/* header */
.top{position:sticky;top:0;z-index:20;display:flex;align-items:center;gap:10px;padding:calc(10px + env(safe-area-inset-top)) 16px 10px;background:color-mix(in srgb,var(--bg) 92%,transparent);backdrop-filter:blur(10px);border-bottom:1px solid color-mix(in srgb,var(--line) 60%,transparent)}
.top h1{font-size:18px;margin:0;font-weight:800;letter-spacing:.2px;white-space:nowrap}
.top .sp{flex:1}
.badge{display:inline-flex;align-items:center;gap:5px;font-size:11px;font-weight:800;letter-spacing:.6px;text-transform:uppercase;color:var(--gold);background:color-mix(in srgb,var(--gold) 7%,transparent);border:1px solid color-mix(in srgb,var(--gold) 45%,transparent);border-radius:999px;padding:2px 9px;white-space:nowrap}
.iconbtn{display:grid;place-items:center;width:38px;height:38px;border-radius:12px;border:1px solid var(--line);background:var(--card);color:var(--muted)}
main{padding:14px 14px 0}
/* cards */
.card{background:var(--card);border:1px solid var(--line);border-radius:var(--r);padding:14px;margin-bottom:14px}
.card h2{display:flex;align-items:center;gap:8px;font-size:15px;margin:0 0 10px;font-weight:750}
.card h2 .r{margin-left:auto;font-size:12px;color:var(--muted);font-weight:600}
.muted{color:var(--muted)}
.small{font-size:12.5px}
.tag{display:inline-block;font-size:10.5px;font-weight:800;letter-spacing:.4px;text-transform:uppercase;padding:1px 6px;border-radius:6px;background:transparent;border:1px solid color-mix(in srgb,var(--gold) 32%,transparent);color:var(--tag-ink);vertical-align:middle}
.up{color:var(--up)}.down{color:var(--down)}
.pagetitle{display:flex;align-items:center;gap:10px;margin:2px 2px 12px}
.pagetitle h2{margin:0;font-size:22px;font-weight:800}
.pagetitle .sp{flex:1}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:6px;border:0;border-radius:12px;padding:10px 14px;font-weight:750;background:var(--accent);color:var(--on-accent)}
.btn.ghost{background:var(--card2);color:var(--ink);border:1px solid var(--line)}
.btn.danger{background:color-mix(in srgb,var(--down) 14%,transparent);color:var(--down);border:1px solid color-mix(in srgb,var(--down) 35%,transparent)}
.btn.sm{padding:7px 11px;font-size:13px;border-radius:10px}
.btn.block{width:100%}
/* brief */
.brief{background:var(--brief-bg);border-color:var(--brief-line)}
.brief h2 .ico{color:var(--gold)}
.brief p{margin:0 0 8px}
.brief .stats{display:flex;gap:8px;margin-top:10px}
.brief .stat{flex:1;background:var(--stat-bg);border-radius:12px;padding:8px 10px}
.brief .stat b{display:block;font-size:16px}
.brief .stat span{font-size:11.5px;color:var(--muted)}
/* treemap */
.tm{position:relative;height:250px;border-radius:12px;overflow:hidden}
.tile{position:absolute;padding:7px 8px;border-radius:8px;overflow:hidden;color:var(--tile-ink);border:0;text-align:left;display:flex;flex-direction:column;justify-content:flex-end}
.tile b{font-size:15px;line-height:1.1;text-shadow:var(--tile-shadow)}
.tile span{font-size:12px;font-weight:700;opacity:.95}
.tile i{font-style:normal;font-size:11px;opacity:.8}
.legend{display:flex;align-items:center;gap:8px;margin-top:9px;font-size:11.5px;color:var(--muted)}
.legend .bar{flex:1;height:7px;border-radius:9px;background:var(--legend)}
/* lists */
.row{display:flex;align-items:center;gap:11px;padding:11px 2px;border-top:1px solid var(--line);background:none;border-left:0;border-right:0;border-bottom:0;width:100%;text-align:left}
.row:first-of-type{border-top:0}
.logo{width:38px;height:38px;border-radius:12px;display:grid;place-items:center;font-weight:850;font-size:12px;color:#fff;flex:none;letter-spacing:.3px}
.row .mid{flex:1;min-width:0}
.row .mid b{display:block;font-size:15px}
.row .mid span{display:block;font-size:12.5px;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.row .end{text-align:right;flex:none}
.row .end b{display:block;font-size:15px}
.row .end span{font-size:12.5px;font-weight:700}
.news{display:flex;gap:11px;padding:12px 0;border-top:1px solid var(--line);background:none;border-left:0;border-right:0;border-bottom:0;width:100%;text-align:left}
.news:first-of-type{border-top:0;padding-top:2px}
.news .ni{width:36px;height:36px;border-radius:11px;background:var(--card2);display:grid;place-items:center;color:var(--accent);flex:none}
.news b{display:block;font-size:14.5px;line-height:1.3;margin-bottom:3px;font-weight:650}
.news .meta{font-size:12px;color:var(--muted)}
.chip{display:inline-block;font-size:11px;font-weight:800;padding:1px 7px;border-radius:6px;background:color-mix(in srgb,var(--accent) 13%,transparent);color:var(--accent);margin-right:4px}
/* summary */
.sum .big{font-size:30px;font-weight:850;letter-spacing:-.5px;line-height:1.1}
.sum .grid{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-top:12px}
.sum .grid div{background:var(--card2);border-radius:12px;padding:9px 11px}
.sum .grid span{display:block;font-size:11.5px;color:var(--muted)}
.sum .grid b{font-size:15px}
.alloc{display:flex;height:9px;border-radius:9px;overflow:hidden;margin-top:12px;gap:2px}
/* stock detail */
.shead{display:flex;align-items:center;gap:10px;margin:0 0 12px}
.shead .t{flex:1;min-width:0}
.shead .t b{font-size:21px;font-weight:850;display:block;line-height:1.1}
.shead .t span{font-size:12.5px;color:var(--muted);display:block;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.price{font-size:32px;font-weight:850;letter-spacing:-.5px;line-height:1.1}
.seg{display:flex;background:var(--card2);border-radius:11px;padding:3px;gap:3px}
.seg button{flex:1;border:0;background:none;border-radius:8px;padding:6px 0;font-weight:750;font-size:13px;color:var(--muted)}
.seg button.on{background:var(--accent);color:var(--on-accent)}
.chart{margin:10px -4px 4px;height:210px}
.lvls{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-top:6px}
.lvls div{border-radius:12px;padding:8px 10px;background:var(--card2);font-size:12px;color:var(--muted)}
.lvls b{display:block;font-size:15px}
.actions{display:flex;gap:8px;margin:0 0 14px}
.actions .btn{flex:1}
.score{display:flex;align-items:center;gap:14px;margin-bottom:10px}
.score .lbl b{display:block;font-size:18px}
.bars .b{margin:9px 0}
.bars .b .h{display:flex;justify-content:space-between;font-size:13px}
.bars .b .h span{color:var(--muted)}
.bars .tr{height:7px;background:var(--card2);border-radius:9px;overflow:hidden;margin-top:4px}
.bars .tr i{display:block;height:100%;border-radius:9px}
.trade{display:flex;align-items:center;gap:10px;padding:10px 0;border-top:1px solid var(--line)}
.trade:first-of-type{border-top:0;padding-top:0}
.trade .k{font-size:11px;font-weight:850;padding:3px 7px;border-radius:7px;flex:none;width:44px;text-align:center}
.trade .k.buy{background:color-mix(in srgb,var(--up) 14%,transparent);color:var(--up)}
.trade .k.sell{background:color-mix(in srgb,var(--down) 14%,transparent);color:var(--down)}
.trade .mid{flex:1;min-width:0;font-size:13px}
.trade .mid b{display:block;font-size:14px}
.trade .end{text-align:right;font-size:12.5px;color:var(--muted)}
.trade .end b{color:var(--ink);display:block;font-size:13.5px}
/* forms */
label.f{display:block;font-size:12.5px;color:var(--muted);margin-bottom:10px}
label.f input,label.f select{display:block;width:100%;margin-top:4px;padding:11px 12px;border-radius:12px;border:1px solid var(--line);background:var(--card2);font-size:16px;outline:none}
label.f input::placeholder{text-transform:none}
label.f input:focus,label.f select:focus{border-color:var(--accent)}
.frow{display:flex;gap:8px}.frow>*{flex:1;min-width:0}
.err{color:var(--down);font-size:13px;min-height:1px}
/* alerts */
.al{display:flex;align-items:center;gap:11px;padding:11px 0;border-top:1px solid var(--line)}
.al:first-of-type{border-top:0}
.al .ai{width:38px;height:38px;border-radius:12px;display:grid;place-items:center;flex:none}
.al .ai.hit{background:color-mix(in srgb,var(--gold) 15%,transparent);color:var(--gold)}
.al .ai.wait{background:var(--card2);color:var(--muted)}
.al .mid{flex:1;min-width:0}
.al .mid b{display:block;font-size:14.5px}
.al .mid span{font-size:12.5px;color:var(--muted)}
.st{font-size:11px;font-weight:850;letter-spacing:.4px;text-transform:uppercase;padding:3px 8px;border-radius:999px}
.st.hit{background:color-mix(in srgb,var(--gold) 16%,transparent);color:var(--gold);border:1px solid color-mix(in srgb,var(--gold) 40%,transparent)}
.st.wait{background:var(--card2);color:var(--muted);border:1px solid var(--line)}
.del{border:0;background:none;color:var(--muted);padding:6px;border-radius:9px}
/* learn */
.lesson{background:var(--card);border:1px solid var(--line);border-radius:var(--r);margin-bottom:10px;overflow:hidden}
.lesson summary{list-style:none;display:flex;align-items:center;gap:12px;padding:12px 14px;cursor:pointer}
.lesson summary::-webkit-details-marker{display:none}
.lesson .li{width:42px;height:42px;border-radius:13px;display:grid;place-items:center;flex:none}
.lesson summary b{display:block;font-size:15px;color:var(--ink)}
.lesson summary span{font-size:12.5px;color:var(--muted)}
.lesson .chev{margin-left:auto;color:var(--muted);transition:transform .2s}
.lesson[open] .chev{transform:rotate(90deg)}
.lesson .body{padding:0 14px 14px 68px;font-size:14px;color:var(--body-ink)}
.lesson .body p{margin:0 0 8px}
.lesson .ex{background:var(--card2);border-radius:11px;padding:8px 10px;font-size:13px;color:var(--muted)}
.lesson .ex b{color:var(--ink)}
/* nav */
nav.tabs{position:fixed;left:0;right:0;bottom:0;z-index:30;display:flex;justify-content:center;background:color-mix(in srgb,var(--navbg) 97%,transparent);backdrop-filter:blur(12px);border-top:1px solid var(--line);padding:6px 6px calc(6px + env(safe-area-inset-bottom))}
nav.tabs .in{display:flex;width:100%;max-width:520px}
nav.tabs button{flex:1;border:0;background:none;color:var(--muted);display:flex;flex-direction:column;align-items:center;gap:2px;font-size:11px;font-weight:700;padding:4px 0}
nav.tabs button .pill{display:grid;place-items:center;width:52px;height:30px;border-radius:999px}
nav.tabs button.on{color:var(--accent)}
nav.tabs button.on .pill{background:color-mix(in srgb,var(--accent) 11%,transparent)}
/* sheet */
.scrim{position:fixed;inset:0;background:rgba(0,0,0,.55);z-index:40;opacity:0;pointer-events:none;transition:opacity .2s}
.sheet{visibility:hidden;position:fixed;left:0;right:0;bottom:0;z-index:41;max-width:520px;margin:0 auto;background:var(--card);border-top-left-radius:22px;border-top-right-radius:22px;border:1px solid var(--line);padding:10px 16px calc(18px + env(safe-area-inset-bottom));transform:translateY(105%);transition:transform .25s}
.sheet .grab{width:42px;height:5px;border-radius:9px;background:var(--line);margin:0 auto 12px}
.sheet h3{margin:0 0 12px;font-size:18px}
body.sheet-open .scrim{opacity:1;pointer-events:auto}
body.sheet-open .sheet{transform:none;visibility:visible}
.toast{position:fixed;left:50%;bottom:calc(var(--nav) + 24px);transform:translateX(-50%) translateY(20px);background:var(--ink);color:var(--bg);font-weight:700;font-size:13.5px;padding:9px 16px;border-radius:999px;opacity:0;transition:.25s;z-index:50;pointer-events:none;white-space:nowrap}
.toast.on{opacity:1;transform:translateX(-50%)}
.empty{text-align:center;color:var(--muted);padding:18px 8px;font-size:14px}
.note{font-size:12px;color:var(--muted);margin:4px 4px 16px;line-height:1.5}
.badge.live{color:var(--accent);background:color-mix(in srgb,var(--accent) 7%,transparent);border-color:color-mix(in srgb,var(--accent) 45%,transparent)}
.src{font-size:11px;font-weight:600;color:var(--muted);opacity:.85}
.soft{display:flex;gap:9px;align-items:flex-start;background:color-mix(in srgb,var(--gold) 5%,transparent);border:1px solid color-mix(in srgb,var(--gold) 22%,transparent);border-radius:12px;padding:10px 12px;font-size:13px;color:var(--muted);margin-bottom:10px}
.soft .ico{color:var(--gold);margin-top:1px}.soft b{color:var(--ink)}
.card .soft:last-child{margin-bottom:0}
a.news{color:inherit;text-decoration:none}
.lnk{color:var(--accent);font-weight:600}
.tops{display:flex;flex-direction:column;gap:6px;margin-top:4px}
.tops a,.tops div{display:block;color:inherit;text-decoration:none;background:var(--stat-bg);border-radius:10px;padding:7px 10px}
.tops b{display:block;font-size:13.5px;font-weight:650;line-height:1.3}
.tops span{font-size:11.5px;color:var(--muted)}
.trade .k.other{background:var(--card2);color:var(--muted)}
.nochart{display:flex;flex-direction:column;align-items:center;text-align:center;gap:6px;padding:26px 12px 18px;color:var(--muted);font-size:13px}
.nochart .ico{color:var(--accent);opacity:.8}.nochart b{color:var(--ink);font-size:15px}
.nochart .btn{margin-top:6px}
.chks{margin-top:10px;display:flex;flex-direction:column;gap:6px}
.chk{display:flex;align-items:center;gap:10px;font-size:13.5px}
.chk span{font-size:11px;font-weight:800;padding:2px 8px;border-radius:999px;min-width:78px;text-align:center}
.okc{background:color-mix(in srgb,var(--up) 13%,transparent);color:var(--up)}.noc{background:color-mix(in srgb,var(--gold) 12%,transparent);color:var(--gold)}
.addbar{display:flex;gap:8px;margin-bottom:12px}
.addbar input{flex:1;min-width:0;padding:11px 12px;border-radius:12px;border:1px solid var(--line);background:var(--card2);font-size:16px;outline:none;text-transform:uppercase}
.addbar input::placeholder{text-transform:none}
.vclose{display:block;font-size:11px;font-weight:600;color:var(--muted);line-height:1.35;margin-top:2px}
.row .mid .vclose{white-space:normal;overflow:visible;text-overflow:unset;font-size:11px;line-height:1.35}
.alpaca-st{margin:8px 0 0;font-size:12.5px;font-weight:650;color:var(--muted)}
.alpaca-st.ok{color:var(--up)}
.alpaca-st.bad{color:var(--down)}
.alpaca-st.warn{color:var(--gold)}
</style>
</head>
<body>
<header class="top">
  <span id="brand"></span>
  <h1 id="appname">Wilson Markets</h1>
  <span class="badge" id="dataBadge" title="Prices, news and filings shown are sample data, not real">Sample data</span>
  <span class="sp"></span>
  <button class="iconbtn" id="gear" aria-label="Settings"></button>
</header>
<main id="main"></main>
<nav class="tabs"><div class="in" id="tabs"></div></nav>
<div class="scrim" id="scrim"></div>
<div class="sheet" id="sheet" role="dialog" aria-modal="true"><div class="grab"></div><div id="sheetBody"></div></div>
<div class="toast" id="toast"></div>
<script>
'use strict';
/* =========================================================
   CONFIG — change the app name here
   ========================================================= */
const APP_NAME = 'Wilson Markets';
const STORE_KEY = 'wilsonMarkets.v1';
const TZ = 'America/New_York';

/* =========================================================
   ICONS — solid pictograms (inline SVG, currentColor)
   ========================================================= */
const P = {
  home:'<path d="M12 1.8 22.2 7.4V9.6H1.8V7.4Z"/><circle cx="12" cy="6.6" r="1.3" style="fill:var(--hole)"/><rect x="3.4" y="10.8" width="2.6" height="7.4" rx=".4"/><rect x="8.2" y="10.8" width="2.6" height="7.4" rx=".4"/><rect x="13.2" y="10.8" width="2.6" height="7.4" rx=".4"/><rect x="18" y="10.8" width="2.6" height="7.4" rx=".4"/><rect x="2.4" y="19.2" width="19.2" height="1.6" rx=".3"/><rect x="1.4" y="21.2" width="21.2" height="1.6" rx=".3"/>',

// Sliding-window limiter: at most `perMin` calls per 60 s, `conc` at a time.
function Limiter(perMin,conc){const hist=[],q=[];let active=0,timer=null;
  const pump=()=>{timer=null;while(q.length&&active<conc){const now=Date.now();while(hist.length&&now-hist[0]>60000)hist.shift();
      if(hist.length>=perMin){timer=setTimeout(pump,60000-(now-hist[0])+60);return}
      const job=q.shift();active++;hist.push(now);job.fn().then(job.res,job.rej).finally(()=>{active--;if(!timer)pump()})}};
  return{run(fn){return new Promise((res,rej)=>{q.push({fn,res,rej});if(!timer)pump()})},used(){const now=Date.now();return hist.filter(t=>now-t<60000).length}}}

  const m=(+o.hour%24)*60+(+o.minute);return!['Sat','Sun'].includes(o.weekday)&&m>=570&&m<960}

const Net={lastError:null};
async function getJSON(apiId,path,params,ttl,{force=false,shape=null}={}){
  const api=APIS[apiId];const key=apiId==='finnhub'?Store.s.settings.finnhubKey:Store.s.settings.twelveKey;
  if(!key)throw new ApiError('nokey');
  const ck=apiId+path+'?'+new URLSearchParams(params);   // cache key never contains the API key
  const c=Cache.get(ck);
  if(c&&!force&&Date.now()-c.t<ttl){if(c.d&&c.d.__err)throw new ApiError(c.d.__err);return c.d}
  if(inflight.has(ck))return inflight.get(ck);
  const stale=()=>c&&c.d&&!c.d.__err?c.d:undefined;
  const p=(async()=>{
    for(let attempt=0;attempt<2;attempt++){
      let r;
      try{r=await api.lim.run(()=>fetch(api.url(path,params,key),{cache:'no-store'}))}
      catch(e){const s=stale();if(s!==undefined)return s;Net.lastError='network';throw new ApiError('network')}
      if(r.status===429){if(attempt===0){await new Promise(z=>setTimeout(z,2500));continue}const s=stale();if(s!==undefined)return s;Net.lastError='ratelimit';throw new ApiError('ratelimit')}
      if(r.status===401){Net.lastError='unauthorized';throw new ApiError('unauthorized')}
      if(r.status===403){Cache.set(ck,{__err:'forbidden'});throw new ApiError('forbidden')}
      if(!r.ok){const s=stale();if(s!==undefined)return s;Net.lastError='network';throw new ApiError('network','HTTP '+r.status)}
      let j;try{j=await r.json()}catch(e){throw new ApiError('network','Bad response')}
      if(apiId==='twelve'&&j&&j.status==='error'){const code=j.code===401?'unauthorized':j.code===429?'ratelimit':j.code===403?'forbidden':'notfound';if(code==='forbidden'||code==='notfound')Cache.set(ck,{__err:code});throw new ApiError(code,j.message)}
      if(apiId==='finnhub'&&j&&typeof j.error==='string'){const code=/access/i.test(j.error)?'forbidden':/key/i.test(j.error)?'unauthorized':'notfound';if(code==='forbidden')Cache.set(ck,{__err:code});throw new ApiError(code,j.error)}
      if(shape)j=shape(j);   // keep only what we use so localStorage stays small
      Net.lastError=null;Cache.set(ck,j);return j}
  })().finally(()=>inflight.delete(ck));
  inflight.set(ck,p);return p}

const ALPACA_DATA_HOST='https://data.alpaca.markets';
const AlpacaNet={status:'idle'}; // connected | unauthorized | forbidden | ratelimit | cors | network | idle

function alpacaStatusClass(){

function alpacaEndISO(){return new Date(Date.now()-16*60*1000).toISOString()}
function alpacaStartISO(){const d=new Date(Date.now()-16*60*1000);d.setUTCDate(d.getUTCDate()-12);return d.toISOString()}
const alpacaLim=Limiter(40,1);
function classifyAlpacaHttp(status,body){
  if(status===401)return 'unauthorized';
  if(status===429)return 'ratelimit';
  if(status===403||status===422){
    const msg=(body&&(body.message||body.error||''))+''+(typeof body==='string'?body:'');
    if(/subscription does not permit|recent SIP|sip/i.test(msg)||status===422)return 'sip_rejected';
    return 'forbidden';
  }
  return 'network';
}
async function alpacaGetBars(symbols,feed,force){
  const uniq=[...new Set(symbols.filter(Boolean))];
  if(!uniq.length)return {bars:{}};
  if(!alpacaReady())throw new ApiError('nokey');
  const params=new URLSearchParams({symbols:uniq.join(','),timeframe:'1Day',feed,start:alpacaStartISO(),end:alpacaEndISO(),limit:'10000',adjustment:'raw',sort:'asc'});
  const url=ALPACA_DATA_HOST+'/v2/stocks/bars?'+params;
  const ck='alpaca:/v2/stocks/bars:'+feed+':'+uniq.slice().sort().join(',')+':'+alpacaEndISO().slice(0,16);
  const c=force?null:Cache.get(ck);
  if(c&&Date.now()-c.t<15*MIN){if(c.d&&c.d.__err)throw new ApiError(c.d.__err);return c.d}
  if(inflight.has(ck))return inflight.get(ck);
  const p=(async()=>{
    let r;
    try{
      r=await alpacaLim.run(()=>fetch(url,{cache:'no-store',headers:{'APCA-API-KEY-ID':Store.s.settings.alpacaKeyId,'APCA-API-SECRET-KEY':Store.s.settings.alpacaSecret}}));
    }catch(e){
      const cors=/failed to fetch|networkerror|load failed|cors/i.test((e&&e.message)||'')||(e&&e.name==='TypeError');
      const code=cors?'cors':'network';
      AlpacaNet.status=code;throw new ApiError(code);
    }
    let body=null;try{body=await r.json()}catch(e){body=null}
    if(!r.ok){
      const code=classifyAlpacaHttp(r.status,body);
      if(code!=='sip_rejected')AlpacaNet.status=code;
      throw new ApiError(code, (body&&(body.message||body.error))||('HTTP '+r.status));
    }
    const bars=(body&&body.bars)||{};
    let token=body&&body.next_page_token;
    let pages=0;
    while(token&&pages<8){
      pages++;
      const u=ALPACA_DATA_HOST+'/v2/stocks/bars?'+params+'&page_token='+encodeURIComponent(token);
      let r2;
      try{r2=await alpacaLim.run(()=>fetch(u,{cache:'no-store',headers:{'APCA-API-KEY-ID':Store.s.settings.alpacaKeyId,'APCA-API-SECRET-KEY':Store.s.settings.alpacaSecret}}))}
      catch(e){break}
      let b2=null;try{b2=await r2.json()}catch(e){b2=null}
      if(!r2.ok)break;
      const more=(b2&&b2.bars)||{};
      if(Array.isArray(bars)&&Array.isArray(more))bars.push(...more);
      else if(more&&typeof more==='object')Object.keys(more).forEach(k=>{bars[k]=(bars[k]||[]).concat(more[k]||[])});
      token=b2&&b2.next_page_token;
    }
    const shaped={bars:bars};
    Cache.set(ck,shaped);return shaped;
  })().finally(()=>inflight.delete(ck));
  inflight.set(ck,p);return p;
}
function barSessionDate(t){
  if(!t)return null;
  const iso=typeof t==='string'?t:new Date(t).toISOString();
  if(iso==='Invalid Date'||!iso)return null;
  const m=String(iso).match(/^(\d{4})-(\d{2})-(\d{2})/);
  if(!m)return null;
  const d=new Date(Date.UTC(+m[1],+m[2]-1,+m[3],12,0,0));
  return d.toLocaleDateString('en-US',{month:'short',day:'numeric',timeZone:'UTC'});
}
function lastBar(list){
  if(!list||!list.length)return null;
  return list[list.length-1];
}
function barsForSymbol(payload,sym){
  const bars=payload&&payload.bars;
  if(!bars)return null;
  if(Array.isArray(bars)){
    if(bars.every(x=>x&&(x.symbol||x.S)))return lastBar(bars.filter(x=>x&&(x.symbol||x.S)===sym));
    return lastBar(bars);
  }
  if(Array.isArray(bars[sym]))return lastBar(bars[sym]);
  return null;
}
async function verifiedCloses(syms){
  const uniq=[...new Set((syms||[]).filter(Boolean))];
  const out={};
  if(!alpacaReady()||!uniq.length)return out;
  const parse=(payload,feed)=>{
    const feedLabel=feed==='iex'?'IEX':'SIP';
    uniq.forEach(sym=>{
      const bar=barsForSymbol(payload,sym);
      if(!bar||bar.c==null)return;
      const dateLabel=barSessionDate(bar.t||bar.Timestamp);
      if(!dateLabel)return;
      out[sym]={close:+bar.c,dateLabel,feed,feedLabel,label:'Close '+dateLabel+' · Alpaca '+feedLabel};
    });
  };
  try{
    try{parse(await alpacaGetBars(uniq,'sip'),'sip')}
    catch(e){
      if(e&&(e.code==='sip_rejected'||e.code==='forbidden'))parse(await alpacaGetBars(uniq,'iex'),'iex');
      else throw e;
    }
    AlpacaNet.status='connected';
  }catch(e){
    if(e&&e.code)AlpacaNet.status=e.code==='sip_rejected'?'forbidden':e.code;
    else AlpacaNet.status='network';
  }
  return out;
}
function vcloseHtml(vc,withPrice=true){

  const head=withPrice?`Verified close ${fmt$(vc.close)}`:'Verified close';
  return `<span class="vclose">${head}<br>${src}</span>`;
}

   ========================================================= */
function qualityScore(f){
  if(!f)return null;
  const mk=(k,v,d,pf,c)=>({k,c,d:v==null?'Not reported':d(v),p:v==null?null:clamp(pf(v),0,20)});
  const parts=[
    mk('Growth',f.revGrowth,v=>'Revenue growth '+v.toFixed(0)+'% / yr',v=>(v+5)/30*20,'var(--accent)'),
    mk('Margins',f.netMargin,v=>'Net profit margin '+v.toFixed(0)+'%',v=>v/30*20,'var(--purple)'),
    mk('Debt',f.debtToEquity,v=>'Debt-to-equity '+v.toFixed(1)+'x',v=>(2.5-v)/2.5*20,'var(--pink)'),
    mk('Cash',f.cashToDebt,v=>'Cash covers '+(v>=5?'5+':v.toFixed(1))+'x its debt',v=>v/2*20,'var(--up)'),
    mk('Valuation',f.pe,v=>v<=0?'P/E n/a (losing money)':'P/E ratio '+v.toFixed(0),v=>v<=0?4:(60-v)/45*20,'var(--gold)')];
  const have=parts.filter(p=>p.p!=null);if(have.length<3)return null;
  const total=Math.round(sum(have.map(x=>x.p))/(have.length*20)*100);
  const label=total>=80?'Excellent':total>=65?'Strong':total>=50?'Fair':total>=35?'Weak':'Poor';
  return{total,label,parts,partial:have.length<5}}
function levels(closes){
  const p=closes[closes.length-1];const w=Math.max(2,Math.round(closes.length/18));const hi=[],lo=[];
  for(let i=w;i<closes.length-w;i++){const win=closes.slice(i-w,i+w+1);if(closes[i]===Math.max(...win))hi.push(closes[i]);if(closes[i]===Math.min(...win))lo.push(closes[i])}
  const below=lo.filter(v=>v<p*.995),above=hi.filter(v=>v>p*1.005);
  return{support:below.length?Math.max(...below):Math.min(...closes),resistance:above.length?Math.min(...above):Math.max(...closes)}}
const ALERT_TYPES={above:'Price rises above',below:'Price falls below',pctUp:'Up today by at least',pctDown:'Down today by at least'};
function alertText(a){return a.type==='above'||a.type==='below'?`${ALERT_TYPES[a.type]} ${fmt$(a.value)}`:`${ALERT_TYPES[a.type]} ${a.value}%`}
function alertHit(a,q){if(!q)return false;switch(a.type){case'above':return q.price>=a.value;case'below':return q.price<=a.value;case'pctUp':return q.changePct>=a.value;case'pctDown':return q.changePct<=-a.value}return false}
// Returns {SYM: quote|null}; failures become null and the first error is kept in m.__err
async function quotes(syms){const u=[...new Set(syms)];const rs=await Promise.all(u.map(s=>safe(data().quote(s))));const m={};
  u.forEach((s,i)=>{m[s]=rs[i].ok?rs[i].v:null;if(!rs[i].ok&&!m.__err)Object.defineProperty(m,'__err',{value:rs[i].e,enumerable:false})});return m}
async function portfolio(){
  const H=Store.s.holdings;const tickers=H.map(h=>h.ticker);
  const [Q,VC]=await Promise.all([quotes(tickers),verifiedCloses(tickers)]);
  const rows=H.map(h=>{const q=Q[h.ticker];const vc=VC[h.ticker]||null;const basis=h.shares*h.cost;if(!q)return{...h,q:null,vc,value:null,basis,gain:null,gainPct:null,day:0};
    const value=h.shares*q.price;return{...h,q,vc,value,basis,gain:value-basis,gainPct:basis?((value-basis)/basis*100):0,day:h.shares*q.change}}).sort((a,b)=>(b.value??-1)-(a.value??-1));
  const priced=rows.filter(r=>r.q);const value=sum(priced.map(r=>r.value)),basis=sum(priced.map(r=>r.basis)),day=sum(priced.map(r=>r.day));
  return{rows,priced,missing:rows.length-priced.length,err:Q.__err||null,value,basis,gain:value-basis,gainPct:basis?(value-basis)/basis*100:0,day,dayPct:value-day?day/(value-day)*100:0}}

/* =========================================================
   TREEMAP (squarified)
   ========================================================= */
function squarify(items,W,H){
  const tot=sum(items.map(i=>i.v))||1;const list=items.map(i=>({...i,a:i.v/tot*W*H}));const out=[];let r={x:0,y:0,w:W,h:H};let row=[];
  const worst=(row,s)=>{if(!row.length)return Infinity;const S=sum(row.map(i=>i.a)),mx=Math.max(...row.map(i=>i.a)),mn=Math.min(...row.map(i=>i.a));return Math.max(s*s*mx/(S*S),S*S/(s*s*mn))};
  const lay=row=>{const S=sum(row.map(i=>i.a));if(r.w>=r.h){const cw=S/r.h;let y=r.y;row.forEach(i=>{const h=i.a/cw;out.push({...i,x:r.x,y,w:cw,h});y+=h});r={x:r.x+cw,y:r.y,w:r.w-cw,h:r.h}}
    else{const rh=S/r.w;let x=r.x;row.forEach(i=>{const w=i.a/rh;out.push({...i,x,y:r.y,w,h:rh});x+=w});r={x:r.x,y:r.y+rh,w:r.w,h:r.h-rh}}};
  while(list.length){const s=Math.min(r.w,r.h);if(worst(row.concat(list[0]),s)<=worst(row,s)){row.push(list.shift())}else{lay(row);row=[]}}
  if(row.length)lay(row);return out}
const cssv=k=>getComputedStyle(document.documentElement).getPropertyValue(k).trim();
const rgbv=k=>cssv(k).split(',').map(Number);
function heatColor(p){const t=clamp(Math.abs(p)/3,0,1);const n=rgbv('--heat-n'),g=rgbv('--heat-up'),rd=rgbv('--heat-down');const e=p>=0?g:rd;const m=n.map((v,i)=>Math.round(v+(e[i]-v)*(.25+.75*t)));return`rgb(${m.join(',')})`}
function drawTreemap(el,rows){
  const W=el.clientWidth,H=el.clientHeight,gap=3;
  const tiles=squarify(rows.map(r=>({v:r.value,r})),W,H);
  el.innerHTML=tiles.map(t=>{const p=t.r.q.changePct;const big=t.w>90&&t.h>70,mid=t.w>46&&t.h>34;
    return`<button class="tile" data-go="stock/${esc(t.r.ticker)}" style="left:${t.x+gap/2}px;top:${t.y+gap/2}px;width:${t.w-gap}px;height:${t.h-gap}px;background:${heatColor(p)}">${mid?`<b>${esc(t.r.ticker)}</b><span>${fmtPct(p)}</span>`:`<span style="font-size:10px">${esc(t.r.ticker)}</span>`}${big?`<i>${fmt$(t.r.value,0)}</i>`:''}</button>`}).join('')}

/* =========================================================

   ========================================================= */
function drawPriceChart(el,c,lv){
  const W=el.clientWidth,H=el.clientHeight,padL=6,padR=58,padT=12,padB=22;const n=c.closes.length;
  const all=c.closes.concat([lv.support,lv.resistance]);let mn=Math.min(...all),mx=Math.max(...all);const pad=(mx-mn)*.08||1;mn-=pad;mx+=pad;
  const X=i=>padL+i/(n-1)*(W-padL-padR),Y=v=>padT+(1-(v-mn)/(mx-mn))*(H-padT-padB);
  const up=c.closes[n-1]>=c.closes[0],col=up?'var(--up)':'var(--down)';
  const line=c.closes.map((v,i)=>(i?'L':'M')+X(i).toFixed(1)+' '+Y(v).toFixed(1)).join('');
  const area=line+`L${X(n-1).toFixed(1)} ${H-padB}L${X(0).toFixed(1)} ${H-padB}Z`;
  const grid=[0,1,2,3].map(k=>{const v=mn+(mx-mn)*(k+.5)/4;const near=Math.min(Math.abs(Y(v)-Y(lv.support)),Math.abs(Y(v)-Y(lv.resistance)))<16;return`<line x1="${padL}" x2="${W-padR}" y1="${Y(v)}" y2="${Y(v)}" style="stroke:var(--chart-grid)" stroke-width="1"/>${near?'':`<text x="${W-padR+6}" y="${Y(v)+4}" style="fill:var(--chart-label)" font-size="10.5">${v>=1000?Math.round(v):v.toFixed(0)}</text>`}`}).join('');
  const lvl=(v,colr,lab)=>`<line x1="${padL}" x2="${W-padR}" y1="${Y(v)}" y2="${Y(v)}" style="stroke:${colr}" stroke-opacity=".7" stroke-width="1.3" stroke-dasharray="4 4"/><rect x="${W-padR+2}" y="${Y(v)-9}" width="${padR-3}" height="18" rx="5" style="fill:${colr}" fill-opacity=".9"/><text x="${W-padR/2+.5}" y="${Y(v)+4}" style="fill:var(--on-tag)" font-size="10.5" font-weight="800" text-anchor="middle">${lab}</text>`;
  const d0=c.dates[0],d1=c.dates[n-1];
  el.innerHTML=`<svg width="${W}" height="${H}" viewBox="0 0 ${W} ${H}"><defs><linearGradient id="ag" x1="0" y1="0" x2="0" y2="1"><stop offset="0" style="stop-color:${col}" stop-opacity=".16"/><stop offset="1" style="stop-color:${col}" stop-opacity="0"/></linearGradient></defs>${grid}<path d="${area}" fill="url(#ag)"/><path d="${line}" fill="none" style="stroke:${col}" stroke-width="1.8" stroke-linejoin="round"/>${lvl(lv.resistance,'var(--gold)','R '+(lv.resistance>=1000?Math.round(lv.resistance):lv.resistance.toFixed(0)))}${lvl(lv.support,'var(--accent)','S '+(lv.support>=1000?Math.round(lv.support):lv.support.toFixed(0)))}<circle cx="${X(n-1)}" cy="${Y(c.closes[n-1])}" r="4" style="fill:${col};stroke:var(--card)" stroke-width="2"/><text x="${padL}" y="${H-5}" style="fill:var(--chart-label)" font-size="10.5">${shortDate(d0)}</text><text x="${W-padR}" y="${H-5}" style="fill:var(--chart-label)" font-size="10.5" text-anchor="end">${shortDate(d1)}</text></svg>`}
function sparkline(closes,w=72,h=28){const mn=Math.min(...closes),mx=Math.max(...closes);const n=closes.length;const col=closes[n-1]>=closes[0]?'var(--up)':'var(--down)';
  const d=closes.map((v,i)=>(i?'L':'M')+(i/(n-1)*w).toFixed(1)+' '+(2+(1-(v-mn)/((mx-mn)||1))*(h-4)).toFixed(1)).join('');
  return`<svg width="${w}" height="${h}" viewBox="0 0 ${w} ${h}" aria-hidden="true"><path d="${d}" fill="none" style="stroke:${col}" stroke-width="1.8" stroke-linejoin="round"/></svg>`}
function ring(score,size=86){const r=size/2-7,C=2*Math.PI*r,col=score>=80?'var(--ring-hi)':score>=65?'var(--ring-good)':score>=50?'var(--ring-mid)':'var(--ring-low)';
  return`<svg width="${size}" height="${size}" viewBox="0 0 ${size} ${size}"><circle cx="${size/2}" cy="${size/2}" r="${r}" style="stroke:var(--ring-track)" stroke-width="8" fill="none"/><circle cx="${size/2}" cy="${size/2}" r="${r}" style="stroke:${col}" stroke-width="8" fill="none" stroke-linecap="round" stroke-dasharray="${C*score/100} ${C}" transform="rotate(-90 ${size/2} ${size/2})"/><text x="50%" y="52%" text-anchor="middle" dominant-baseline="middle" style="fill:var(--ink)" font-size="24" font-weight="850">${score}</text></svg>`}

function holdingSheet(h,presetTicker){
  const ed=!!h;
  openSheet(`<h3>${ed?'Edit holding':'Add holding'}</h3>
   <label class="f">Ticker<input id="fT" value="${esc(h?h.ticker:(presetTicker||''))}" placeholder="e.g. AAPL" autocapitalize="characters" autocomplete="off" style="text-transform:uppercase"></label>
   <div class="frow"><label class="f">Shares<input id="fS" inputmode="decimal" value="${h?h.shares:''}" placeholder="10"></label><label class="f">Avg cost / share ($)<input id="fC" inputmode="decimal" value="${h?h.cost:''}" placeholder="150.00"></label></div>
   <div class="err" id="fE"></div>
   <div class="frow" style="margin-top:8px">${ed?`<button class="btn danger" id="fD">${ic('trash',16)} Delete</button>`:`<button class="btn ghost" id="fX">Cancel</button>`}<button class="btn" id="fOk">${ed?'Save':'Add holding'}</button></div>`,b=>{
    $('#fOk',b).onclick=()=>{const t=normTicker($('#fT',b).value),s=parseFloat($('#fS',b).value),c=parseFloat($('#fC',b).value);
      if(!t)return $('#fE',b).textContent='Enter a ticker symbol.';if(!(s>0))return $('#fE',b).textContent='Shares must be more than 0.';if(!(c>=0))return $('#fE',b).textContent='Enter what you paid per share.';
      if(ed)Object.assign(h,{ticker:t,shares:s,cost:c});else{const ex=Store.s.holdings.find(x=>x.ticker===t);if(ex){const tot=ex.shares+s;ex.cost=(ex.cost*ex.shares+c*s)/tot;ex.shares=tot}else Store.s.holdings.push({id:Store.uid(),ticker:t,shares:s,cost:c})}
      Store.save();closeSheet();toast(ed?'Holding updated':'Holding added');route()};
    if(ed)$('#fD',b).onclick=()=>{if(!confirm('Delete '+h.ticker+' from your portfolio?'))return;Store.s.holdings=Store.s.holdings.filter(x=>x.id!==h.id);Store.save();closeSheet();toast('Holding deleted');route()};
    else $('#fX',b).onclick=closeSheet;
  })}

async function renderStock(sym){
  sym=normTicker(sym);if(!sym){location.hash='watch';return}
  const D=data();const live=D.live;
  const [Rq,Rpr,Rc,Rf,Ri,Rg,Rn,VC]=await Promise.all([safe(D.quote(sym)),safe(D.profile(sym)),safe(D.candles(sym,260)),safe(D.fundamentals(sym)),safe(D.insiders(sym)),safe(D.congress(sym)),safe(D.news([sym])),verifiedCloses([sym])]);
  const q=Rq.ok?Rq.v:null;const vc=VC[sym]||null;const pr=Rpr.ok?Rpr.v:{name:sym,sector:'',type:KNOWN_ETFS.has(sym)?'etf':'stock',marketCap:null,etf:null};
  const h=Store.s.holdings.find(x=>x.ticker===sym);const watching=Store.s.watchlist.includes(sym);const qs=Rf.ok?qualityScore(Rf.v):null;
  const isFund=pr.type==='etf';

  let quality;

  else if(!Rf.ok)quality=soft(Rf.e,'Financials unavailable');
  else if(!qs)quality=soft('Not enough reported financials to score this company.');
  else quality=`<div class="score">${ring(qs.total)}<div class="lbl"><b>${qs.label}</b><span class="muted small">Out of 100, from growth, margins, debt, cash and valuation${qs.partial?' (scored on the parts that are reported)':''}.${pr.marketCap?` Market cap ${fmtBig(pr.marketCap)}.`:''}</span></div></div>
   <div class="bars">${qs.parts.map(p=>`<div class="b"><div class="h"><b>${p.k}</b><span>${esc(p.d)}${p.p==null?'':' · '+Math.round(p.p)+'/20'}</span></div><div class="tr"><i style="width:${(p.p||0)/20*100}%;background:${p.c}"></i></div></div>`).join('')}</div>`;
  const cgBody=!Rg.ok?(Rg.e.code==='forbidden'?soft('Congress trades need a paid Finnhub plan, so this section is off for now.'):soft(Rg.e,'Congress trades unavailable')):
    (Rg.v.map(t=>`<div class="trade"><span class="k ${t.kind}">${t.kind==='buy'?'BUY':'SELL'}</span><span class="mid"><b>${esc(t.member)}</b><span class="muted">${esc(t.chamber)} · traded ${shortDate(t.date)}</span></span><span class="end"><b>${esc(t.amount)}</b>filed ${shortDate(t.filed)}</span></div>`).join('')||'<p class="muted small" style="margin:0">No reported Congress trades in the last year.</p>')+
    `<p class="note" style="margin:8px 0 0">Members of Congress can report trades up to 45 days late, and only give dollar ranges.${live?'':' Names shown are placeholders.'}</p>`;
  main().innerHTML=`
  <div class="shead"><button class="iconbtn" id="bk" aria-label="Back">${ic('back',20)}</button>${logo(sym)}<span class="t"><b>${esc(sym)}</b><span>${esc(pr.name)}${pr.sector?' · '+esc(pr.sector):''}</span></span><button class="iconbtn" id="wt" aria-label="${watching?'Remove from':'Add to'} watchlist" style="color:${watching?'var(--gold)':'var(--muted)'}">${ic(watching?'star':'starO',20)}</button></div>
  <section class="card">${q?`<div style="display:flex;align-items:flex-end;gap:10px"><span class="price">${fmt$(q.price)}</span><b class="${cls(q.change)}" style="padding-bottom:4px">${fmtS$(q.change)} (${fmtPct(q.changePct)})</b><span class="sp" style="flex:1"></span>${live?'':sampleNote}</div>${live&&q.time?`<div class="muted small">As of ${asOf(q.time)} · Finnhub</div>`:''}${vc?vcloseHtml(vc):''}`:soft(Rq.e,'Price unavailable')}
   ${Rc.ok?`<div class="chart" id="ch"></div>
   <div class="seg" id="rg">${[[21,'1M'],[63,'3M'],[126,'6M'],[260,'1Y']].map(([d,l])=>`<button data-d="${d}" class="${d===chartRange?'on':''}">${l}</button>`).join('')}</div>
   <div class="lvls" id="lv"></div>

   :`<div class="nochart">${ic('candles',30)}<b>${Rc.e.code==='nohistory'?'Chart history needs a different data source':'Chart unavailable'}</b><span>${esc(Rc.e.code==='nohistory'?'Finnhub\'s free plan doesn\'t include price history. Add a free Twelve Data key in Settings to turn on charts and support / resistance lines.':errMsg(Rc.e))}</span>${Rc.e.code==='nohistory'?`<button class="btn sm ghost" data-go="settings">Open Settings</button>`:''}</div>`}</section>
  <div class="actions"><button class="btn ghost" id="pos">${ic(h?'pencil':'plus',16)} ${h?'Edit position':'Add to portfolio'}</button><button class="btn ghost" id="sa">${ic('bell',16)} Set alert</button></div>
  ${h&&q?`<section class="card"><h2>${ic('pie',19,'style="color:var(--accent)"')} Your position</h2><div class="lvls" style="margin:0"><div>Value<b>${fmt$(h.shares*q.price)}</b></div><div>Gain / loss<b class="${cls(q.price-h.cost)}">${fmtS$((q.price-h.cost)*h.shares,0)} (${fmtPct(h.cost?(q.price-h.cost)/h.cost*100:0,1)})</b></div><div>Shares<b>${fmtNum(h.shares)}</b></div><div>Avg cost<b>${fmt$(h.cost)}</b></div></div></section>`:''}
  <section class="card"><h2>${ic('shield',19,'style="color:var(--accent)"')} Quality score <span class="r">${isFund?'':tagOr()}</span></h2>${quality}</section>
  <section class="card"><h2>${ic('idcard',19,'style="color:var(--purple)"')} Insider trades <span class="r">${tagOr('SEC Form 4 via Finnhub')}</span></h2>
   ${!Ri.ok?soft(Ri.e,'Insider trades unavailable'):(Ri.v.map(t=>`<div class="trade"><span class="k ${t.kind}">${insK(t)}</span><span class="mid"><b>${esc(t.name)}</b><span class="muted">${esc(t.role)} · ${shortDate(t.date)}</span></span><span class="end"><b>${t.shares.toLocaleString()} sh</b>${t.price?'@ '+fmt$(t.price):'no price'}</span></div>`).join('')||`<p class="muted small" style="margin:0">${isFund?'Funds do not have insider filings.':'No insider filings in the last 6 months.'}</p>`)}</section>
  <section class="card"><h2>${ic('capitol',19,'style="color:var(--gold)"')} Congress trades <span class="r">${Rg.ok?tagOr():''}</span></h2>${cgBody}</section>

      $('#lv').innerHTML=`<div>${ic('candles',14,'style="color:var(--accent)"')} Support<b>${fmt$(lv.support)}</b>${((px-lv.support)/px*100).toFixed(1)}% below price</div><div>${ic('candles',14,'style="color:var(--gold)"')} Resistance<b>${fmt$(lv.resistance)}</b>${lv.resistance<=px*1.002?'Testing the range high':((lv.resistance-px)/px*100).toFixed(1)+'% above price'}</div>`};
    draw();
    $('#rg').onclick=e=>{const b=e.target.closest('button');if(!b)return;chartRange=+b.dataset.d;$('#rg').querySelectorAll('button').forEach(x=>x.classList.toggle('on',x===b));draw()};}
  $('#bk').onclick=()=>{location.hash=lastTab};
  $('#wt').onclick=()=>{if(watching)Store.s.watchlist=Store.s.watchlist.filter(x=>x!==sym);else Store.s.watchlist.unshift(sym);Store.save();toast(watching?'Removed from watchlist':'Added to watchlist');route()};
  $('#pos').onclick=()=>holdingSheet(h,sym);

}

    <div class="err" id="aE"></div><button class="btn block">${ic('bell',16)} Create alert</button></form></section>
  <section class="card"><h2>Triggered <span class="r">${hits.length}</span></h2>${hits.map(item).join('')||'<div class="empty">None right now.</div>'}</section>

}

const LESSONS=[
  ['receipt','var(--accent)','Shares, cost basis & gain','What you own and how you are doing',`<p>A <b>share</b> is a tiny slice of a company. Your <b>cost basis</b> is what you paid in total. Your <b>gain or loss</b> is today's value minus that cost.</p><div class="ex"><b>Example:</b> 10 shares bought at $100 = $1,000 basis. At $120 they're worth $1,200, a $200 (20%) gain. It's "unrealized" until you sell.</div>`],

  ['scale','var(--gold)','P/E ratio','Is the price high or low for its profits?',`<p>The <b>price-to-earnings ratio</b> = share price ÷ yearly profit per share. It tells you how many dollars investors pay for $1 of profit.</p><div class="ex"><b>Example:</b> a $50 stock earning $2.50 a share has a P/E of 20. A high P/E usually means people expect fast growth; it can also mean it's pricey.</div>`],
  ['coin','var(--up)','Dividends','Getting paid to hold',`<p>A <b>dividend</b> is cash a company pays shareholders, usually every quarter. The <b>dividend yield</b> = yearly dividend ÷ share price.</p><div class="ex"><b>Example:</b> a $60 stock paying $1.80 a year yields 3%. Many people reinvest dividends to buy more shares automatically.</div>`],
  ['candles','var(--accent)','Support & resistance','Price levels traders watch',`<p><b>Support</b> is a price where buyers have stepped in before, so the price tended to bounce up. <b>Resistance</b> is where sellers showed up and the price stalled.</p><div class="ex">When a price breaks clearly through resistance, that old ceiling often becomes the new floor. These are hints, not rules.</div>`],
  ['layers','var(--pink)','ETFs & index funds','Owning many stocks at once',`<p>An <b>ETF</b> is a basket of investments that trades like one stock. An index ETF like an S&amp;P 500 fund owns roughly 500 large US companies.</p><div class="ex">The <b>expense ratio</b> is the yearly fee. 0.03% means $3 a year per $10,000 invested.</div>`],

];

  $('#sTheme').onclick=e=>{const b=e.target.closest('button');if(!b||!window.__theme)return;window.__theme.set(b.dataset.t);$('#sTheme').querySelectorAll('button').forEach(x=>x.classList.toggle('on',x===b))};
  $('#sP').onclick=e=>{const b=e.target.closest('button');if(!b)return;s.provider=b.dataset.p;Store.save();inflight.clear();toast(b.dataset.p==='live'?(s.finnhubKey?'Live data on':'Add your key to go live'):'Sample data on');renderSettings();updateBadge()};
  $('#sShow').onclick=()=>{['#sK','#sT','#sAId','#sASec'].forEach(id=>{const i=$(id);if(i)i.type=i.type==='password'?'text':'password'});$('#sShow').textContent=$('#sK').type==='password'?'Show':'Hide'};
  $('#sSave').onclick=()=>{s.finnhubKey=$('#sK').value.trim();s.twelveKey=$('#sT').value.trim();s.alpacaKeyId=$('#sAId').value.trim();s.alpacaSecret=$('#sASec').value.trim();AlpacaNet.status='idle';Store.save();Cache.clear();toast('Keys saved on this device');renderSettings();updateBadge()};
  $('#sClearAlpaca').onclick=()=>{s.alpacaKeyId='';s.alpacaSecret='';AlpacaNet.status='idle';Store.save();Cache.clear();toast('Alpaca keys removed from this device');renderSettings()};
  if(alpacaReady()){verifiedCloses(['AAPL']).then(()=>{const el=$('#alpacaSt');if(!el)return;el.textContent=alpacaStatusText();el.className='alpaca-st '+alpacaStatusClass()})}
  $('#sTest').onclick=async()=>{const out=$('#sRes');s.finnhubKey=$('#sK').value.trim();s.twelveKey=$('#sT').value.trim();s.alpacaKeyId=$('#sAId').value.trim();s.alpacaSecret=$('#sASec').value.trim();Store.save();
    const fk=s.finnhubKey;if(!fk){out.innerHTML=soft('Paste your Finnhub key first.');return}
    out.innerHTML='<p class="muted small">Testing…</p>';
    const row=(name,r)=>`<div class="chk"><span class="${r===true?'okc':'noc'}">${r===true?'Works':r}</span>${name}</div>`;
    const t=async(fn)=>{try{await fn();return true}catch(e){return e.code==='forbidden'?'Paid plan':e.code==='unauthorized'?'Bad key':e.code==='nohistory'?'Not on plan':'Error'}};
    const res=[['Quotes',await t(()=>fh('/quote',{symbol:'AAPL'},0,{force:true}))]];
    if(res[0][1]==='Bad key'){out.innerHTML=soft('Finnhub rejected this key. Double-check it on finnhub.io.');return}
    res.push(['Company profile',await t(()=>fh('/stock/profile2',{symbol:'AAPL'},0,{force:true}))]);
    res.push(['Company & market news',await t(()=>fh('/news',{category:'general'},0,{force:true,shape:NEWS_SHAPE}))]);
    res.push(['Financials (quality score)',await t(()=>fh('/stock/metric',{symbol:'AAPL',metric:'all'},0,{force:true,shape:METRIC_SHAPE}))]);
    res.push(['Insider trades',await t(()=>fh('/stock/insider-transactions',{symbol:'AAPL'},0,{force:true,shape:x=>({n:(x.data||[]).length})}))]);
    Cache.set('flag:fhCongress',0);localStorage.removeItem(Cache.P+'flag:fhCongress');res.push(['Congress trades',await t(()=>LiveProvider.congress('AAPL'))]);
    localStorage.removeItem(Cache.P+'flag:fhCandle');res.push(['Price history (charts)',await t(()=>LiveProvider.candles('AAPL',30))]);
    if(alpacaReady()){
      AlpacaNet.status='idle';
      const aok=await t(()=>alpacaGetBars(['AAPL'],'sip',true).catch(async e=>{if(e&&(e.code==='sip_rejected'||e.code==='forbidden'))return alpacaGetBars(['AAPL'],'iex',true);throw e}));
      if(aok===true)AlpacaNet.status='connected';
      res.push(['Alpaca verified close',aok===true?true:aok]);
      const el=$('#alpacaSt');if(el){el.textContent=alpacaStatusText();el.className='alpaca-st '+alpacaStatusClass()}
    }
    out.innerHTML=`<div class="chks">${res.map(([n,r])=>row(n,r)).join('')}</div>`;updateBadge()};
  $('#sCache').onclick=()=>{Cache.clear();inflight.clear();toast('Cached market data cleared');renderSettings()};
  $('#sReset').onclick=()=>{if(!confirm('Replace your holdings, watchlist and alerts with the sample starter set?'))return;const keep={...s};Store.s=SAMPLE_STATE();Object.assign(Store.s.settings,keep);Store.save();toast('Sample holdings loaded')};
  $('#sWipe').onclick=()=>{if(!confirm('Erase all holdings, watchlist, alerts, cached data and your keys from this device?'))return;Store.s={...SAMPLE_STATE(),holdings:[],watchlist:[],alerts:[]};Store.s.settings={provider:'sample',finnhubKey:'',twelveKey:'',alpacaKeyId:'',alpacaSecret:''};AlpacaNet.status='idle';Store.save();Cache.clear();toast('All data erased');renderSettings();updateBadge()};
}
function updateBadge(){const b=$('#dataBadge');const live=isLive();b.textContent=live?'Live':'Sample data';b.classList.toggle('live',live);b.title=live?'Market data from Finnhub':'Prices, news and filings shown are sample data, not real'}

/* =========================================================
   SHEET, ROUTER, BOOT
   ========================================================= */
function openSheet(html,mount){$('#sheetBody').innerHTML=html;document.body.classList.add('sheet-open');mount&&mount($('#sheetBody'));setTimeout(()=>{const i=$('#sheetBody input');if(i&&!i.value)i.focus()},250)}
function closeSheet(){document.body.classList.remove('sheet-open')}
const VIEWS={home:renderHome,portfolio:renderPortfolio,watch:renderWatch,alerts:renderAlerts,learn:renderLearn,stock:renderStock,settings:renderSettings};
async function route(){
  const [v,arg]=(location.hash.slice(1)||'home').split('/');const view=VIEWS[v]?v:'home';
  if(TABS.some(t=>t[0]===view))lastTab=view;
  $('#tabs').querySelectorAll('button').forEach(b=>b.classList.toggle('on',b.dataset.tab===(view==='stock'||view==='settings'?(view==='stock'?lastTab:''):view)));
  closeSheet();updateBadge();
  try{await VIEWS[view](arg&&decodeURIComponent(arg))}catch(e){main().innerHTML=`<div class="card"><b>Something went wrong.</b><p class="muted small">${esc(e.message)}</p></div>`;console.error(e)}
  if(route._v!==location.hash){window.scrollTo(0,0);route._v=location.hash}
}
function boot(){
  window.route=route;
  document.title=APP_NAME;$('#appname').textContent=APP_NAME;$('#brand').innerHTML=BRAND;$('#gear').innerHTML=ic('gear',20);
  $('#tabs').innerHTML=TABS.map(([k,l,i])=>`<button data-tab="${k}"><span class="pill">${ic(i,23)}</span>${l}</button>`).join('');
  $('#tabs').onclick=e=>{const b=e.target.closest('button');if(b)location.hash=b.dataset.tab};
  $('#gear').onclick=()=>location.hash='settings';
  $('#scrim').onclick=closeSheet;
  document.addEventListener('click',e=>{const g=e.target.closest('[data-go]');if(g&&!e.target.closest('[data-edit],[data-rm]'))location.hash=g.dataset.go});
  Store.load();updateBadge();window.addEventListener('hashchange',route);
  let rt;window.addEventListener('resize',()=>{clearTimeout(rt);rt=setTimeout(()=>{if(/^#?(home|stock)/.test(location.hash||'home'))route()},200)});
  route();
}
boot();
</script>
